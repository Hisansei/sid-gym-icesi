<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{components/base :: page(title='Rutinas de Usuario', content=~{::content})}">

<section th:fragment="content" class="routine-page">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/routine/routine.css}">

    <header class="site-header">
        <div class="container">
            <h1 class="page-title">Rutinas de <span th:text="${username}">Usuario</span></h1>
            <a th:href="@{/mvc/trainer/dashboard}" class="btn btn-secondary">Volver al Dashboard</a>
        </div>
    </header>

    <main class="container page-content">
        <div th:if="${#lists.isEmpty(routines)}" class="alert alert-info">
            El usuario no tiene rutinas creadas.
        </div>

        <div class="table-wrapper" th:if="${!#lists.isEmpty(routines)}">
            <table class="table">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Nivel</th>
                    <th>Estado</th>
                    <th>Ejercicios</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${routines}">
                    <td th:text="${r.name}">Nombre</td>
                    <td th:text="${r.description}">Desc</td>
                    <td th:text="${r.level}">Nivel</td>
                    <td>
                        <span th:if="${r.status}" class="badge success">Activa</span>
                        <span th:if="${!r.status}" class="badge">Inactiva</span>
                    </td>
                    <td th:text="${#lists.size(r.exercises)}">0</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</section>
</html>
