<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{components/base :: page(title='Panel de Entrenador', content=~{::content})}">

<section th:fragment="content" class="trainer-dashboard-page">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <header class="site-header">
        <div class="container">
            <div>
                <h1 class="page-title">Panel de Entrenador</h1>
                <p class="muted">Gestiona tus usuarios asignados y monitorea su progreso.</p>
            </div>
        </div>
    </header>

    <main class="container layout-grid">

        <section class="main-column full-width">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Mis usuarios asignados</h2>
                </div>
                <div class="card-body">

                    <div th:if="${#lists.isEmpty(assignments)}" class="alert alert-info">
                        No tienes usuarios asignados actualmente.
                    </div>

                    <table th:if="${!#lists.isEmpty(assignments)}" class="table table-striped table-hover">
                        <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Fecha asignación</th>
                            <th>Estado</th>
                            <th style="width: 220px;">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="a : ${assignments}">
                            <td th:text="${a.userUsername}">usuario</td>
                            <td th:text="${a.assignedAt != null ? #temporals.format(a.assignedAt, 'yyyy-MM-dd HH:mm') : '-'}">
                                2024-01-01 10:00
                            </td>
                            <td>
                                <span th:if="${a.active}" class="badge bg-success">Activa</span>
                                <span th:if="${!a.active}" class="badge bg-secondary">Inactiva</span>
                            </td>
                            <td>
                                <div class="actions-group">
                                    <a th:href="@{'/mvc/trainer/users/' + ${a.userUsername} + '/routines'}"
                                       class="btn btn-sm btn-outline">
                                        Rutinas
                                    </a>
                                    <a th:href="@{'/mvc/trainer/users/' + ${a.userUsername} + '/progress'}"
                                       class="btn btn-sm btn-outline">
                                        Progreso
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>
</section>
</html>
