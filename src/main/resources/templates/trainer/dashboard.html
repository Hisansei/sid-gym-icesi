<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{components/base :: page(title='Panel entrenador', content=~{::content})}">

<section th:fragment="content" class="content">
    <div class="page-header">
        <h1>Panel del entrenador</h1>
        <p class="text-muted">Usuarios actualmente asignados a ti.</p>
    </div>

    <div sec:authorize="hasRole('EMPLOYEE') and authentication.principal.employeeType == 'Instructor'">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Mis usuarios asignados</h2>
            </div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(assignments)}" class="alert alert-info">
                    No tienes usuarios asignados actualmente.
                </div>

                <table th:if="${!#lists.isEmpty(assignments)}" class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Fecha inicio</th>
                        <th>Fecha asignación</th>
                        <th>Estado</th>
                        <th style="width: 220px;">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${assignments}">
                        <td th:text="${a.userUsername}">usuario</td>
                        <td th:text="${a.startDate != null ? #temporals.format(a.startDate, 'yyyy-MM-dd') : '-'}">2024-01-01</td>
                        <td th:text="${a.createdAt != null ? #temporals.format(a.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">
                            2024-01-01 10:00
                        </td>
                        <td>
                            <span th:if="${a.active}" class="badge bg-success">Activa</span>
                            <span th:if="${!a.active}" class="badge bg-secondary">Cerrada</span>
                        </td>
                        <td>
                            <a th:href="@{|/mvc/trainer/users/${a.userUsername}/routines|}"
                               class="btn btn-sm btn-primary me-1">
                                Ver rutinas
                            </a>
                            <a th:href="@{|/mvc/trainer/users/${a.userUsername}/progress|}"
                               class="btn btn-sm btn-outline-primary">
                                Ver progreso
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div sec:authorize="! (hasRole('EMPLOYEE') and authentication.principal.employeeType == 'Instructor')" class="alert alert-danger mt-3">
        No tienes permisos para ver este panel.
    </div>
</section>

</html>
